services:
  # 1. Frontend Static Site
  - type: web
    name: chessflow-frontend
    env: static
    buildCommand: npm install && npx turbo run build --filter=frontend
    staticPublishPath: ./apps/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_BACKEND_URL
        value: https://chessflow-backend.onrender.com
      - key: VITE_APP_WS_URL
        value: wss://chessflow-ws.onrender.com

  # 2. REST API Backend
  - type: web
    name: chessflow-backend
    env: node
    plan: free
    buildCommand: npm install && node scripts/copy-engines.js && npx turbo run build --filter=backend
    startCommand: node apps/backend/dist/index.js
    envVars:
      - fromGroup: chessflow-secrets
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # 3. WebSocket Realtime Engine
  - type: web
    name: chessflow-ws
    env: node
    plan: free
    buildCommand: npm install && node scripts/copy-engines.js && npx turbo run build --filter=ws
    startCommand: node apps/ws/dist/index.js
    envVars:
      - fromGroup: chessflow-secrets
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

envVarGroups:
  - name: chessflow-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: AUTH_REDIRECT_URL
        value: https://chessflow-px48.vercel.app
      - key: GOOGLE_CALLBACK_URL
        value: https://chessflow-backend.onrender.com/auth/google/callback
      - key: GITHUB_CALLBACK_URL
        value: https://chessflow-backend.onrender.com/auth/github/callback
